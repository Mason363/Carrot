name: Foreword
options:
  bundleIdPrefix: io.github.mason363
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 8GFSXN32MA
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
packages:
  ForewordKit:
    path: ForewordKit
targets:
  Foreword:
    type: application
    platform: macOS
    sources:
      - path: Sources/Foreword
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Resources/Credits.rtf
        buildPhase: resources
    dependencies:
      - package: ForewordKit
        product: ForewordEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mason363.Foreword
        PRODUCT_NAME: Foreword
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/Foreword.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
      configs:
        Release:
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # Notarization rejects the debugging entitlement Xcode injects into plain builds.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    postBuildScripts:
      - name: Thin embedded frameworks
        script: "\"${SRCROOT}/scripts/thin-frameworks.sh\""
        basedOnDependencyAnalysis: false
